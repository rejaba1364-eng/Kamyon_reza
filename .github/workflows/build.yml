name: Build Kamyon Reza Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted Ubuntu runners already include the Android SDK.
      # Avoid android-actions/setup-android@v3: it requests the obsolete
      # SDK package "tools", which now makes sdkmanager fail.
      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Android project and install maintained source
        shell: bash
        run: |
          set -euo pipefail
          test -f source/MainActivity.kt
          mkdir -p app/src/main/java/com/reza/kamyon app/src/main/res/values

          cat > settings.gradle.kts <<'GRADLE_SETTINGS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "KamyonReza"
          include(":app")
          GRADLE_SETTINGS

          cat > build.gradle.kts <<'ROOT_GRADLE'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          ROOT_GRADLE

          cat > gradle.properties <<'GRADLE_PROPERTIES'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          GRADLE_PROPERTIES

          cat > app/build.gradle.kts <<'APP_GRADLE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.reza.kamyon"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.reza.kamyon"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 2
                  versionName = "2.0.0"
              }

              signingConfigs {
                  create("release") {
                      storeFile = file("kamyon-release.jks")
                      storePassword = System.getenv("KAMYON_KEYSTORE_PASSWORD") ?: ""
                      keyAlias = "kamyonrelease"
                      keyPassword = System.getenv("KAMYON_KEYSTORE_PASSWORD") ?: ""
                  }
              }

              buildTypes {
                  getByName("release") {
                      isMinifyEnabled = false
                      signingConfig = signingConfigs.getByName("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
          }
          APP_GRADLE

          cat > app/src/main/AndroidManifest.xml <<'ANDROID_MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <application
                  android:allowBackup="true"
                  android:label="کامیون رضا"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <receiver android:name=".ReminderReceiver" android:exported="false" />
                  <receiver android:name=".BootReceiver" android:enabled="true" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          ANDROID_MANIFEST

          cat > app/src/main/res/values/styles.xml <<'ANDROID_STYLES'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#176B5B</item>
                  <item name="android:navigationBarColor">#F4F7F6</item>
                  <item name="android:statusBarColor">#124C42</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          ANDROID_STYLES

          cat > app/src/main/java/com/reza/kamyon/ReminderReceiver.kt <<'KOTLIN_REMINDER'
          package com.reza.kamyon

          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import androidx.core.app.NotificationCompat

          class ReminderReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val kind = intent.getStringExtra("kind") ?: "document"
                  val title = when (kind) {
                      "insurance" -> "یادآوری بیمه شخص ثالث"
                      "inspection" -> "یادآوری معاینه فنی"
                      else -> "یادآوری مراجعه گارانتی"
                  }
                  val message = when (kind) {
                      "insurance" -> "موعد بیمه شخص ثالث خودروی شما نزدیک است؛ برای تمدید اقدام کنید."
                      "inspection" -> "موعد معاینه فنی خودروی شما نزدیک است؛ برای دریافت نوبت اقدام کنید."
                      else -> "موعد مراجعه بعدی گارانتی خودروی شما نزدیک است."
                  }
                  val manager = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  if (Build.VERSION.SDK_INT >= 26) {
                      manager.createNotificationChannel(NotificationChannel("vehicle_reminders", "یادآوری‌های خودرو", NotificationManager.IMPORTANCE_DEFAULT))
                  }
                  val requestCode = when (kind) { "insurance" -> 1; "inspection" -> 2; else -> 3 }
                  val openApp = PendingIntent.getActivity(
                      context, 3000 + requestCode, Intent(context, MainActivity::class.java),
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  val notification = NotificationCompat.Builder(context, "vehicle_reminders")
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setContentTitle(title)
                      .setContentText(message)
                      .setStyle(NotificationCompat.BigTextStyle().bigText(message))
                      .setContentIntent(openApp)
                      .setAutoCancel(true)
                      .build()
                  manager.notify(4100 + requestCode, notification)
              }
          }
          KOTLIN_REMINDER

          cat > app/src/main/java/com/reza/kamyon/BootReceiver.kt <<'KOTLIN_BOOT'
          package com.reza.kamyon

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == Intent.ACTION_BOOT_COMPLETED) {
                      val prefs = context.getSharedPreferences("kamyon_reza", Context.MODE_PRIVATE)
                      ReminderScheduler.schedule(context, "insurance", prefs.getString("date_insurance", "") ?: "")
                      ReminderScheduler.schedule(context, "inspection", prefs.getString("date_inspection", "") ?: "")
                      ReminderScheduler.schedule(context, "warranty", prefs.getString("warranty_next_date", "") ?: "")
                  }
              }
          }
          KOTLIN_BOOT

          cp source/MainActivity.kt app/src/main/java/com/reza/kamyon/MainActivity.kt

      - name: Restore stable application signing key
        env:
          KAMYON_KEYSTORE_BASE64: ${{ secrets.KAMYON_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KAMYON_KEYSTORE_BASE64" || { echo "Missing GitHub secret: KAMYON_KEYSTORE_BASE64"; exit 1; }
          printf '%s' "$KAMYON_KEYSTORE_BASE64" | base64 --decode > app/kamyon-release.jks
          test -s app/kamyon-release.jks

      - name: Build signed release APK
        env:
          KAMYON_KEYSTORE_PASSWORD: ${{ secrets.KAMYON_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KAMYON_KEYSTORE_PASSWORD" || { echo "Missing GitHub secret: KAMYON_KEYSTORE_PASSWORD"; exit 1; }
          gradle --no-daemon :app:assembleRelease

      - name: Save APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kamyon-Reza-2.0.0-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kamyon-v2.0.0-${{ github.run_number }}
          name: کامیون رضا نسخه ۲.۰.۰ - ساخت ${{ github.run_number }}
          body: نسخه جدید برنامه کامیون رضا با تقویم شمسی، ثبت سوابق مستقل و بانک اطلاعاتی داخلی.
          files: app/build/outputs/apk/release/app-release.apk
          make_latest: true
          fail_on_unmatched_files: true
